<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#38a9f4" />
  <meta name="description" content="Kuda — I build things." />
  <title>Kuda</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="site-bg" aria-hidden="true"></div>
  <div class="site-tint" aria-hidden="true"></div>
  <div class="cursor-pointer" aria-hidden="true">
    <img class="cursor-arrow" src="assets/img/cursor-arrow.png" alt="" />
    <img class="cursor-hand" src="assets/img/cursor-hand.png" alt="" />
  </div>

  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <header class="topbar" data-reveal>
        <a class="top-pill brand-pill shine-hover" href="#top" aria-label="Kuda home">
          <span class="mini-k" aria-hidden="true">K</span>
          <span>Kuda</span>
        </a>
        <a class="top-pill edits-pill shine-hover" href="#edits">My edits <span aria-hidden="true">↓</span></a>
      </header>

      <div class="hero-card" data-reveal data-delay="80">
        <h1 id="hero-title">Hey, I’m <span class="kuda-word">Kuda</span> <span class="wave" aria-hidden="true">👋</span></h1>
        <p>I build things.</p>

        <nav class="socials" aria-label="Social links">
          <a class="social-icon-button shine-hover" href="https://discord.gg/fernsmp" target="_blank" rel="noopener noreferrer" aria-label="FernSMP Discord" data-tooltip="Discord">
            <svg class="pixel-icon" viewBox="0 0 32 32" aria-hidden="true" shape-rendering="crispEdges">
              <path d="M8 8h4V7h2V6h4v1h2v1h4v3h2v9h-2v3h-4v2h-3v-2h-2v-1h-4v1H9v2H6v-2H4v-3H2v-9h2V8h4Zm5 6h2v2h-2v-2Zm4 0h2v2h-2v-2Zm-5 4h8v1h-8v-1Z" />
            </svg>
          </a>
          <a class="social-icon-button shine-hover" href="https://www.instagram.com/playfernsmp" target="_blank" rel="noopener noreferrer" aria-label="FernSMP Instagram" data-tooltip="Instagram">
            <svg class="pixel-icon" viewBox="0 0 32 32" aria-hidden="true" shape-rendering="crispEdges">
              <path fill-rule="evenodd" d="M8 5h16v3h3v16h-3v3H8v-3H5V8h3V5Zm2 5v12h12V10H10Zm4 2h4v2h2v4h-2v2h-4v-2h-2v-4h2v-2Zm6-3h3v3h-3V9Z" />
            </svg>
          </a>
          <a class="social-icon-button shine-hover" href="https://www.tiktok.com/@playfernsmp" target="_blank" rel="noopener noreferrer" aria-label="FernSMP TikTok" data-tooltip="TikTok">
            <svg class="pixel-icon" viewBox="0 0 32 32" aria-hidden="true" shape-rendering="crispEdges">
              <path d="M17 5h5v4h4v4h-4v8c0 4-3 7-7 7H9v-4H6v-7h3v-3h7v5h-4v4h3c2 0 3-1 3-3V5h-1Z" />
            </svg>
          </a>
          <a class="social-icon-button shine-hover" href="https://www.youtube.com/@ilyKuda" target="_blank" rel="noopener noreferrer" aria-label="Kuda YouTube" data-tooltip="YouTube">
            <svg class="pixel-icon" viewBox="0 0 32 32" aria-hidden="true" shape-rendering="crispEdges">
              <path d="M7 8h18v2h3v12h-3v2H7v-2H4V10h3V8Zm7 5v7l7-3.5L14 13Z" />
            </svg>
          </a>
        </nav>
      </div>

      <a class="scroll-cue" href="#edits" aria-label="Keep scrolling" data-reveal data-delay="160">keep scrolling <span>↘</span></a>
    </section>

    <section class="showcase-section edits-section" id="edits" aria-labelledby="edits-title">
      <div class="section-head" data-reveal>
        <p class="tiny-label">a few things I’ve edited</p>
        <h2 id="edits-title">I also edit sometimes...</h2>
      </div>

      <div class="carousel edits-carousel" data-carousel="edits" data-reveal data-delay="80">
        <button class="carousel-arrow carousel-prev shine-hover" type="button" aria-label="Previous edit">←</button>
        <div class="carousel-viewport" id="editsViewport" tabindex="0" aria-label="Editing reel carousel">
          <div class="carousel-track" id="editsTrack"></div>
        </div>
        <button class="carousel-arrow carousel-next shine-hover" type="button" aria-label="Next edit">→</button>
      </div>
      <p class="carousel-note" data-reveal data-delay="130">drag it around · click a video to watch</p>
    </section>

    <section class="showcase-section shorts-section" id="shorts" aria-labelledby="shorts-title">
      <div class="section-head shorts-head" data-reveal>
                <h2 id="shorts-title">and I make Shorts.</h2>
        <a class="channel-link shine-hover" href="https://www.youtube.com/@ilyKuda/shorts" target="_blank" rel="noopener noreferrer">@ilyKuda <span>↗</span></a>
      </div>

      <div class="carousel shorts-carousel" data-carousel="shorts" data-reveal data-delay="80">
        <button class="carousel-arrow carousel-prev shine-hover" type="button" aria-label="Previous Short">←</button>
        <div class="carousel-viewport" id="shortsViewport" tabindex="0" aria-label="YouTube Shorts carousel">
          <div class="carousel-track" id="shortsTrack"></div>
        </div>
        <button class="carousel-arrow carousel-next shine-hover" type="button" aria-label="Next Short">→</button>
      </div>
      <p class="carousel-note shorts-note" data-reveal data-delay="130">drag to browse · tap one to watch</p>
    </section>
  </main>

  <footer>
    <span>Kuda © <span id="year"></span></span>
    <a href="#top">back to top ↑</a>
  </footer>

  <div class="video-modal" id="videoModal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Video player">
    <div class="modal-backdrop" data-close-video></div>
    <div class="modal-card">
      <button class="modal-close shine-hover" type="button" aria-label="Close video" data-close-video>×</button>
      <div class="video-frame">
        <iframe id="videoFrame" title="YouTube video player" allow="autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
